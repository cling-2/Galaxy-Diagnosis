# Galaxy 诊断工具默认配置
# 部署时可通过环境变量覆盖（前缀 GALAXY_），如 GALAXY_LLM_BASE_URL

llm:
  base_url: "http://localhost:11434/v1"   # Ollama 默认地址，可改为 vLLM 等地址
  model: "qwen3:1.7b"
  api_key: "ollama"                        # Ollama 不需要真实 key，OpenAI SDK 要求非空
  timeout: 600    # 纯 CPU 推理 8B 模型需 3-5 分钟，留足余量
  max_retries: 3
  max_tokens: 1024                          # 最大输出 token 数，防止无限生成
  embed_model: "bge:large"        # RAG embedding 模型（离线部署：联网机下载 .gguf + 客户机 ollama create 导入）；空字符串=禁用 RAG

# hardware 段默认根据 llm.model 的参数量自动推导（见 src/galaxy_diag/config/model_profile.py）。
# 例如 qwen3:1.7b → 2核/4GB内存/1.94GB显存/3.5GB磁盘；qwen3:8b → 8核/7.4GB/5.4GB/9.2GB。
# 如需手动覆盖某项，取消注释并填写（显式值优先于自动推导）：
# hardware:
#   min_cpu_cores: 4
#   min_ram_gb: 3.0
#   min_gpu_vram_gb: 6.0
#   min_disk_gb: 10.0
#   gpu_required: false

# 客户知识库检索配置（REQ-X-02）
knowledge:
  top_k: 3                 # 检索返回的最大案例数
  min_similarity: 0.0      # 最低余弦相似度阈值，0.0=不过滤
