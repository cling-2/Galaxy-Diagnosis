[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-diag"
version = "0.1.0"
description = "银河平台部署问题定位工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
completion = ["argcomplete>=3.0.0"]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.scripts]
galaxy-diag = "galaxy_diag.workflow.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
